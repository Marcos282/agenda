{% if category.id == 'agenda' %}
<svg class="manual-diagram" viewBox="0 0 480 108" role="img" aria-label="Exemplo de dois períodos de atendimento separados por intervalo"><rect x="18" y="26" width="168" height="42" rx="10" class="diagram-fill"/><path d="M196 47h88" stroke="currentColor" stroke-dasharray="5 5"/><rect x="294" y="26" width="168" height="42" rx="10" class="diagram-fill"/><text x="102" y="52">08:00 → 12:00</text><text x="378" y="52">14:00 → 18:00</text><text x="240" y="92">Intervalo sem atendimento</text></svg>
{% elif category.id == 'profissionais' %}
<svg class="manual-diagram" viewBox="0 0 480 108" role="img" aria-label="Profissional associado aos seus serviços e horários"><circle cx="65" cy="30" r="15" class="diagram-fill"/><path d="M35 80v-10a30 30 0 0 1 60 0v10M115 52h50m-12-9 12 9-12 9" fill="none" stroke="currentColor" stroke-width="3"/><rect x="186" y="22" width="120" height="60" rx="10" class="diagram-fill"/><text x="246" y="57">Serviços</text><path d="M324 52h28m-12-9 12 9-12 9" fill="none" stroke="currentColor" stroke-width="3"/><rect x="370" y="22" width="92" height="60" rx="10" class="diagram-fill"/><text x="416" y="57">Agenda</text></svg>
{% elif category.id == 'whatsapp' %}
<svg class="manual-diagram" viewBox="0 0 480 108" role="img" aria-label="Exemplo de opções do lembrete: 1 confirmar presença, 2 cancelar, se ativadas"><path d="M24 18h432v66H54L24 98Z" class="diagram-fill"/><circle cx="60" cy="42" r="12" fill="var(--surface)"/><circle cx="60" cy="68" r="12" fill="var(--surface)"/><text x="60" y="46">1</text><text x="60" y="72">2</text><text x="240" y="46">Confirmar presença</text><text x="240" y="72">Cancelar agendamento</text></svg>

<svg class="manual-diagram" viewBox="0 0 480 108" role="img" aria-label="Exemplo de composição visual: logomarca e escolhas de cor"><rect x="28" y="12" width="254" height="84" rx="12" fill="var(--surface)" stroke="currentColor"/><path d="M28 34h254" stroke="currentColor"/><circle cx="42" cy="23" r="3" fill="currentColor"/><text x="155" y="69">Sua logomarca</text><circle cx="330" cy="54" r="18" fill="#287454"/><circle cx="382" cy="54" r="18" fill="#375c89"/><circle cx="434" cy="54" r="18" fill="#805b79"/></svg>
{% elif category.id == 'renovacao' %}

{% else %}
<svg class="manual-diagram" viewBox="0 0 480 108" role="img" aria-label="Sequência de aprendizado: localizar a opção, conferir os dados e verificar o resultado"><rect x="20" y="22" width="126" height="64" rx="12" class="diagram-fill"/><text x="83" y="59">Localizar</text><path d="M158 54h24m-8-8 8 8-8 8M306 54h24m-8-8 8 8-8 8" fill="none" stroke="currentColor" stroke-width="3"/><rect x="196" y="22" width="96" height="64" rx="12" class="diagram-fill"/><text x="244" y="59">Conferir</text><rect x="344" y="22" width="116" height="64" rx="12" class="diagram-fill"/><text x="402" y="59">Verificar</text></svg>
