<section class="manual-video" data-category-video aria-label="Vídeo da categoria {{ category.title }}" hidden><p class="manual-video-title">Assista ao tutorial</p><div class="manual-video-player">{% if category.video_id %}<iframe data-video-player data-video-id="{{ category.video_id }}" title="Tutorial Tá Combinado: {{ category.title }}" loading="lazy" referrerpolicy="strict-origin-when-cross-origin" allow="accelerometer; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen></iframe>{% else %}<div class="manual-video-placeholder" role="note"><span aria-hidden="true">▶</span><strong>Vídeo em breve</strong><p>Estamos preparando o vídeo sobre {{ category.title }}.</p><small>Enquanto isso, acompanhe os passos abaixo.</small></div>{% endif %}</div></section>
