<link rel="canonical" href="{{ seo_url }}">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Tá Combinado">
<meta property="og:locale" content="{{ current_language.locale|default:'pt_BR' }}">
<meta property="og:title" content="{{ seo_title }}">
<meta property="og:description" content="{{ seo_description }}">
<meta property="og:url" content="{{ seo_url }}">
<meta name="twitter:card" content="summary">
<meta name="twitter:title" content="{{ seo_title }}">
<meta name="twitter:description" content="{{ seo_description }}">
<script type="application/ld+json">{{ seo_json|safe }}</script>
{% for option in language_options %}
<link rel="alternate" hreflang="{{ option.tag }}" href="{{ option.url }}">
{% if forloop.first %}<link rel="alternate" hreflang="x-default" href="{{ option.url }}">{% endif %}
{% endfor %}
