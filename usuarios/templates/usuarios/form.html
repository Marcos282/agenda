{% extends 'usuarios/base.html' %}
{% block title %}{{ titulo }}{% endblock %}
{% block content %}
<h1>{{ titulo }}</h1>
<form method="post">
  {% csrf_token %}
  {{ form.as_p }}
  <button type="submit">{{ botao }}</button>
</form>
{% if login_form %}<p><a href="{% url 'lembrar_senha' %}">Esqueci minha senha</a></p><p>Ainda não tem conta?</p><a class="ui-button ui-button-secondary" href="{% url 'cadastro' %}{% if destino %}?next={{ destino|urlencode }}{% endif %}">Criar conta</a>{% endif %}
{% endblock %}
