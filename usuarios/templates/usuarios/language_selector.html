{% load i18n %}
{% if current_language %}
<details class="language-selector">
  <summary aria-label="{% translate 'Idioma' %}: {{ current_language.label }}">
    <span aria-hidden="true">🌐</span> <span lang="{{ current_language.tag }}">{{ current_language.label }}</span> <span aria-hidden="true">⌄</span>
  </summary>
  <form method="post" action="{% url 'institutional_language' %}">
    {% csrf_token %}
    <input type="hidden" name="page" value="{{ institutional_page }}">
    {% for option in language_options %}
    <button type="submit" name="language" value="{{ option.code }}" lang="{{ option.tag }}"{% if option.code == current_language.code %} aria-current="true"{% endif %}>
      <span aria-hidden="true">{{ option.flag }}</span> {{ option.label }}
    </button>
    {% endfor %}
  </form>
</details>
{% endif %}
