<span class="client-reputation{% if not reputacao.disponivel %} client-reputation-new{% endif %}" data-customer-reputation>
{% if reputacao.disponivel %}<span class="rating-stars" role="img" aria-label="{{ reputacao.nota|floatformat:2 }} de 4 estrelas">{% for preenchimento in reputacao.preenchimentos %}<span class="star" style="--star-fill:{{ preenchimento }}%" aria-hidden="true">★</span>{% endfor %}</span><span class="rating-average">{{ reputacao.nota|floatformat:2 }}/4</span><span class="rating-count">{{ reputacao.quantidade }} avaliações</span>{% else %}Cliente Novo — Reputação em formação{% endif %}
</span>
